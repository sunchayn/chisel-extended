name: run-php-tests

on:
  pull_request:
  push:
    branches: [base]
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      php: ${{ steps.filter.outputs.php == 'true' || github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            php:
              - '**.php'
              - '.github/workflows/php-tests.yml'
              - 'tests/phpunit.xml.dist'
              - 'composer.json'
              - 'composer.lock'

  test:
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        php: [8.2, 8.3, 8.4]
        dependency-version: [prefer-lowest, prefer-stable]

    name: Tests P${{ matrix.php }} - ${{ matrix.os }} - ${{ matrix.dependency-version }}

    steps:
      - name: Checkout
        if: needs.changes.outputs.php == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        if: needs.changes.outputs.php == 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, zip
          coverage: pcov

      - name: Get Composer cache directory
        if: needs.changes.outputs.php == 'true'
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        if: needs.changes.outputs.php == 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: dependencies-php-${{ matrix.php }}-os-${{ matrix.os }}-version-${{ matrix.dependency-version }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: dependencies-php-${{ matrix.php }}-os-${{ matrix.os }}-version-${{ matrix.dependency-version }}-composer-

      - name: Install Composer dependencies
        if: needs.changes.outputs.php == 'true'
        run: composer update --${{ matrix.dependency-version }} --no-interaction --prefer-dist

      - name: Tests with coverage
        if: needs.changes.outputs.php == 'true' && matrix.php == '8.4' && matrix.dependency-version == 'prefer-stable'
        run: composer test:coverage-ci

      - name: Tests
        if: needs.changes.outputs.php == 'true' && (matrix.php != '8.4' || matrix.dependency-version != 'prefer-stable')
        run: composer test

      - name: Upload coverage reports to Codecov
        if: needs.changes.outputs.php == 'true' && matrix.php == '8.4' && matrix.dependency-version == 'prefer-stable'
        uses: codecov/codecov-action@v4
        with:
          file: ./build/coverage.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
